<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | My Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <nav>
    <a href="index.html" class="logo">My Portfolio</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <section>
    <h2>Contact Me</h2>
    <p>Have a question or want to work together? Fill out the form below or reach out directly.</p>

    <div class="contact-wrapper">
      <div class="contact-info">
        <p><strong>Email:</strong><br /><a href="mailto:hello@example.com">hello@example.com</a></p>
        <p><strong>Location:</strong><br />Available remotely</p>
        <p><strong>Response time:</strong><br />Usually within 24 hours</p>
      </div>

      <form class="contact-form" action="#" method="post">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="How can I help you?" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 My Portfolio. All rights reserved.</p>
  </footer>

</body>
</html>
